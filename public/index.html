<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Cloud</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%237dd3fc'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='19' fill='%23121b32'/%3E%3Cpath d='M18 42h29a9 9 0 0 0 0-18 15 15 0 0 0-28-2 10 10 0 0 0-1 20Z' fill='url(%23g)' stroke='%23e8f4ff' stroke-opacity='.85' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="/scram/scramjet.all.js"></script>

  <script src="/baremux/index.js"></script>

  <script src="register-sw.js" defer></script>

  <script src="search.js" defer></script>

  <script src="index.js" defer></script>

  <style>

    :root {

      color-scheme: dark;

      --bg: #111116;

      --panel: #1b1b21;

      --panel-hover: #24242c;

      --border: #34343d;

      --muted: #85858f;

      --text: #f4f2fa;

      --accent: #c8b9ff;

      --rail-width: 58px;

      --rail-expanded: 220px;

    }

    * { box-sizing: border-box; }

    html, body {

      width: 100%;

      height: 100%;

      margin: 0;

    }

    body {

      overflow: hidden;

      background: var(--bg);

      color: var(--text);

      font-family: "DM Sans", Arial, sans-serif;

      font-size: 13px;

    }

    button, input { font: inherit; }

    button { color: inherit; }

    /* HOME SCREEN */

    .home-view {

      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 24px 24px 24px calc(var(--rail-width) + 20px);

      overflow-y: auto;

      transition: padding-left .22s ease;

    }

    .home-content {

      width: min(480px, 100%);

      margin: auto;

      transform: translateY(-5px);

    }

    .brand {

      margin: 0;

      text-align: center;

      font-family: "Outfit", "DM Sans", Arial, sans-serif;

      font-size: clamp(66px, 9vw, 96px);

      line-height: 1.1;

      font-weight: 700;

      font-style: normal;

      letter-spacing: -4px;

      background: linear-gradient(105deg, #fff 35%, #cbbcff 82%);

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;

    }

    .subtitle {

      margin: 20px 0 31px;

      text-align: center;

      color: #b6b1c2;

      font-family: "DM Sans", Arial, sans-serif;

      font-style: normal;

      font-size: 13px;

    }

    .search-wrap { position: relative; width: 100%; }

    .search-icon {

      position: absolute;

      left: 17px;

      top: 50%;

      width: 16px;

      height: 16px;

      color: #777783;

      transform: translateY(-50%);

      pointer-events: none;

    }

    #home-address, #sj-address {

      width: 100%;

      height: 46px;

      padding: 0 17px 0 40px;

      outline: none;

      border: 1px solid #303039;

      border-radius: 12px;

      background: #1a1a20;

      color: var(--text);

      font-size: 14px;

      transition: border-color .18s, *background* .18s, box-shadow .18s;

    }

    #home-address::placeholder, #sj-address::placeholder {

      color: #777780;

    }

    #home-address:focus, #sj-address:focus {

      border-color: #76669e;

      background: #1d1c25;

      box-shadow: 0 0 0 3px #bba5ff12;

    }

    .shortcuts {

      display: grid;

      grid-template-columns: repeat(6, minmax(0, 1fr));

      gap: 8px;

      margin-top: 16px;

    }

    .shortcut {

      min-width: 0;

      min-height: 90px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 8px;

      padding: 10px 4px;

      border: 1px solid var(--border);

      border-radius: 12px;

      background: var(--panel);

      cursor: pointer;

      transition: transform .18s, *background* .18s, border-color .18s;

    }

    .shortcut:hover {

      transform: translateY(-2px);

      background: var(--panel-hover);

      border-color: #55505f;

    }

    .shortcut:active { transform: scale(.97); }

    .shortcut-icon {
      display: block;
      width: 38px;
      height: 38px;
      padding: 4px;
      border-radius: 10px;
      object-fit: contain;
      background: transparent;
    }

    .shortcut-label {

      max-width: 100%;

      overflow: hidden;

      color: #e6e3eb;

      font-size: 11px;

      text-align: center;

      text-overflow: ellipsis;

      white-space: nowrap;

    }


    /* LEFT TAB SIDEBAR */

    .tabs-rail {

      position: fixed;

      z-index: 100;

      top: 0;

      bottom: 0;

      left: 0;

      width: var(--rail-width);

      display: flex;

      flex-direction: column;

      gap: 8px;

      padding: 12px 8px;

      overflow: hidden;

      border-right: 1px solid #292930;

      border-radius: 0;

      background: #15151a;

      transition: width .22s ease;

    }

    .tabs-rail:hover,

    .tabs-rail:focus-within {

      width: var(--rail-expanded);

      box-shadow: 8px 0 28px #0003;

    }

    .tab-list {

      flex: 1;

      min-height: 0;

      display: flex;

      flex-direction: column;

      gap: 6px;

      overflow-x: hidden;

      overflow-y: auto;

      scrollbar-width: thin;

    }

    .tab-item {

      width: 100%;

      min-height: 42px;

      flex: 0 0 42px;

      display: flex;

      align-items: center;

      gap: 11px;

      padding: 0 8px;

      overflow: hidden;

      border: 1px solid transparent;

      border-radius: 10px;

      background: transparent;

      color: #aaa8b5;

      cursor: pointer;

      transition: *background* .16s, border-color .16s, color .16s;

    }

    .tab-item:hover {

      color: #fff;

      background: #ffffff09;

    }

    .tab-item.active {

      color: #fff;

      border-color: #c8b9ff2a;

      background: #c8b9ff13;

    }

    .tab-icon {

      width: 24px;

      height: 24px;

      flex: 0 0 24px;

      display: grid;

      place-items: center;

      overflow: hidden;

      border-radius: 6px;

      font-size: 17px;

    }

    .tab-favicon {

      width: 20px;

      height: 20px;

      object-fit: contain;

      border-radius: 4px;

    }

    .tab-title {

      flex: 1;

      min-width: 0;

      overflow: hidden;

      opacity: 0;

      white-space: nowrap;

      text-overflow: ellipsis;

      transition: opacity .16s ease;

    }

    .tabs-rail:hover .tab-title,

    .tabs-rail:focus-within .tab-title {

      opacity: 1;

      transition-delay: .06s;

    }

    .tab-close {

      width: 24px;

      height: 26px;

      flex: 0 0 24px;

      display: grid;

      place-items: center;

      padding: 0;

      border: 0;

      border-radius: 6px;

      background: transparent;

      color: #9693a1;

      cursor: pointer;

      opacity: 0;

      transition: opacity .12s, *background* .12s;

    }

    .tabs-rail:hover .tab-close,

    .tabs-rail:focus-within .tab-close {

      opacity: 1;

    }

    .tab-close:hover {

      color: white;

      background: #ffffff13;

    }

    .rail-add {

      height: 40px;

      min-height: 40px;

      width: 100%;

      display: flex;

      align-items: center;

      gap: 12px;

      padding: 0 10px;

      overflow: hidden;

      border: 1px solid #393640;

      border-radius: 10px;

      background: #ffffff05;

      color: #d0c9e0;

      cursor: pointer;

    }

    .rail-add:hover { background: #c8b9ff13; }

    .rail-add > span:first-child {

      width: 20px;

      flex: 0 0 20px;

      text-align: center;

      font-size: 20px;

    }

    .rail-add-label {

      opacity: 0;

      white-space: nowrap;

      transition: opacity .15s;

    }

    .tabs-rail:hover .rail-add-label,

    .tabs-rail:focus-within .rail-add-label {

      opacity: 1;

    }

    /* BROWSER WORKSPACE */

    .workspace {

      position: absolute;

      inset: 0;

      display: none;

    }

    .workspace.has-frame { display: block; }

    .browser-toolbar {

      position: absolute;

      z-index: 10;

      top: 0;

      left: var(--rail-width);

      right: 0;

      height: 57px;

      display: flex;

      align-items: center;

      gap: 8px;

      padding: 6px 14px;

      border-bottom: 1px solid #292930;

      background: #15151a;

      transition: left .22s ease;

    }

    .toolbar-btn {

      width: 34px;

      height: 34px;

      flex: 0 0 34px;

      display: grid;

      place-items: center;

      border: 1px solid transparent;

      border-radius: 9px;

      background: transparent;

      color: #aaa8b4;

      cursor: pointer;

      font-size: 17px;

    }

    .toolbar-btn:hover {

      border-color: #383640;

      background: #ffffff08;

      color: white;

    }

    .address-form { flex: 1; min-width: 0; }

    #sj-form { display: flex; width: 100%; }

    #sj-search-engine { display: none; }

    #sj-address { height: 38px; }

    #frames-container {

      position: absolute;

      top: 57px;

      right: 0;

      bottom: 0;

      left: var(--rail-width);

      overflow: hidden;

      background: var(--bg);

      transition: left .22s ease;

    }

    #frames-container iframe {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      border: 0;

      display: none;

      background: white;

    }

    #frames-container iframe.active { display: block; }

    .error-box {

      position: absolute;

      z-index: 15;

      top: 62px;

      left: calc(var(--rail-width) + 15px);

      right: 15px;

      color: #ff8e9b;

      pointer-events: none;

      white-space: pre-wrap;

    }

    #sj-error-code { font-size: 11px; }

    @media (hover: hover) {

      body:has(.tabs-rail:hover) .home-view {

        padding-left: calc(var(--rail-expanded) + 20px);

      }

      body:has(.tabs-rail:hover) .browser-toolbar {

        left: var(--rail-expanded);

      }

      body:has(.tabs-rail:hover) #frames-container {

        left: var(--rail-expanded);

      }

      body:has(.tabs-rail:hover) .error-box {

        left: calc(var(--rail-expanded) + 15px);

      }

    }

    @media (max-width: 650px) {

      :root {

        --rail-width: 48px;

        --rail-expanded: 190px;

      }

      .home-view { padding-right: 12px; }

      .shortcuts { grid-template-columns: repeat(3, minmax(0, 1fr)); }

      .shortcut { min-height: 79px; }

      .brand { font-size: 68px; }

      .browser-toolbar { gap: 3px; padding-inline: 6px; }

      .toolbar-btn { width: 30px; flex-basis: 30px; }

    }

    @media (prefers-reduced-motion: reduce) {

      *, *::before, *::after {

        transition-duration: .01ms !important;

        animation-duration: .01ms !important;

      }

    }



    /* CLOUD GLASSMORPHISM THEME — visual overrides only; Scramjet hooks stay unchanged */
    :root {
      color-scheme: dark;
      --bg: #080d19;
      --panel: rgba(255,255,255,.075);
      --panel-hover: rgba(255,255,255,.13);
      --border: rgba(205,220,255,.16);
      --muted: #9aa9c4;
      --text: #f4f7ff;
      --accent: #a9c9ff;
      --rail-width: 62px;
      --rail-expanded: 224px;
    }
    body {
      background:
        radial-gradient(ellipse at 18% 12%, rgba(84,130,255,.22), transparent 38%),
        radial-gradient(ellipse at 82% 78%, rgba(151,104,255,.18), transparent 36%),
        linear-gradient(135deg, #080d19 0%, #10172b 52%, #0a1020 100%);
      color: var(--text);
    }
    .home-view {
      background:
        radial-gradient(circle at 50% 34%, rgba(105,151,255,.08), transparent 32%),
        transparent;
    }
    .home-content { width: min(560px, 100%); }
    .brand {
      font-family: "DM Sans", Arial, sans-serif;
      font-style: normal;
      font-weight: 700;
      letter-spacing: -5px;
      background: linear-gradient(115deg, #fff 12%, #c7dcff 48%, #b9aaff 90%);
      -webkit-background-clip: text;
      background-clip: text;
      filter: drop-shadow(0 8px 34px rgba(125,160,255,.16));
    }
    .subtitle {
      margin-top: 14px;
      color: #aebbd4;
      font-family: "DM Sans", Arial, sans-serif;
      font-style: normal;
      letter-spacing: .025em;
    }
    #home-address, #sj-address {
      border: 1px solid rgba(205,220,255,.2);
      border-radius: 16px;
      background: rgba(255,255,255,.075);
      color: #f5f7ff;
      box-shadow: 0 12px 38px rgba(0,0,0,.16), inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      transition: border-color .18s, background .18s, box-shadow .18s;
    }
    #home-address { height: 54px; padding-left: 46px; }
    #home-address::placeholder, #sj-address::placeholder { color: #9aa9c4; }
    #home-address:focus, #sj-address:focus {
      border-color: rgba(166,196,255,.65);
      background: rgba(255,255,255,.11);
      box-shadow: 0 0 0 4px rgba(130,166,255,.11), 0 12px 38px rgba(0,0,0,.18);
    }
    .search-icon { color: #a9bbde; }
    .shortcuts { gap: 10px; margin-top: 20px; }
    .shortcut {
      min-height: 96px;
      border: 1px solid rgba(205,220,255,.14);
      border-radius: 17px;
      background: rgba(255,255,255,.055);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.045), 0 10px 30px rgba(0,0,0,.08);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      transition: transform .18s, background .18s, border-color .18s, box-shadow .18s;
    }
    .shortcut:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,.105);
      border-color: rgba(174,199,255,.34);
      box-shadow: 0 14px 32px rgba(0,0,0,.15);
    }
    .shortcut-label { color: #e4ebfb; }
    .tabs-rail {
      border-right: 1px solid rgba(205,220,255,.12);
      border-radius: 0 20px 20px 0;
      background: rgba(12,18,34,.68);
      box-shadow: 8px 0 32px rgba(0,0,0,.12);
      backdrop-filter: blur(26px);
      -webkit-backdrop-filter: blur(26px);
    }
    .tabs-rail:hover, .tabs-rail:focus-within {
      box-shadow: 8px 0 34px rgba(0,0,0,.25);
      background: rgba(14,21,40,.86);
    }
    .tab-item { border-radius: 12px; color: #aab8d2; }
    .tab-item:hover { background: rgba(255,255,255,.075); }
    .tab-item.active {
      border-color: rgba(167,194,255,.28);
      background: rgba(137,169,255,.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .rail-add {
      border-color: rgba(205,220,255,.17);
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      color: #d8e4ff;
    }
    .rail-add:hover { background: rgba(137,169,255,.14); }
    .browser-toolbar {
      border-bottom: 1px solid rgba(205,220,255,.12);
      background: rgba(10,15,29,.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }
    .toolbar-btn { border-radius: 11px; color: #bdc9e2; }
    .toolbar-btn:hover {
      border-color: rgba(205,220,255,.16);
      background: rgba(255,255,255,.08);
      color: white;
    }
    #sj-address { height: 38px; border-radius: 12px; }
    #frames-container { background: #fff; }
    .error-box { color: #ff9eae; }
    @media (max-width: 650px) {
      .brand { letter-spacing: -3px; }
      .shortcuts { gap: 8px; }
      .shortcut { border-radius: 14px; }
    }

  </style>

</head>

<body>

  <section id="home-view" class="home-view">

    <div class="home-content">

      <h1 class="brand">Cloud</h1>

      <p class="subtitle">your space on the web</p>

      <form id="home-form" class="search-wrap" autocomplete="off">

        <svg class="search-icon" viewBox="0 0 24 24" fill="none"

             stroke="currentColor" stroke-width="1.8" aria-hidden="true">

          <circle cx="10.8" cy="10.8" r="6.8"></circle>

          <path d="m16 16 4 4"></path>

        </svg>

        <input id="home-address" type="text"

               placeholder="Search or enter address"

               aria-label="Search or enter address">

      </form>

      <div class="shortcuts" id="shortcuts">

        <button class="shortcut" data-url="https://www.youtube.com" type="button">

          <img class="shortcut-icon youtube" src="https://www.youtube.com/s/desktop/a6171d17/img/favicon.ico" alt="" loading="lazy" decoding="async">

          <span class="shortcut-label">YouTube</span>

        </button>

        <button class="shortcut" data-url="https://www.tiktok.com" type="button">

          <img class="shortcut-icon tiktok" src="https://www.tiktok.com/favicon.ico" alt="" loading="lazy" decoding="async">

          <span class="shortcut-label">TikTok</span>

        </button>

        <button class="shortcut" data-url="https://www.roblox.com" type="button">

          <img class="shortcut-icon roblox" src="https://www.roblox.com/favicon.ico" alt="" loading="lazy" decoding="async">

          <span class="shortcut-label">Roblox</span>

        </button>

        <button class="shortcut" data-url="https://www.robtopgames.com" type="button">

          <img class="shortcut-icon gd" src="https://robtopgames.com/favicon.ico" alt="" loading="lazy" decoding="async">

          <span class="shortcut-label">Geometry Dash</span>

        </button>

        <button class="shortcut" data-url="https://kick.com" type="button">

          <img class="shortcut-icon kick" src="https://kick.com/favicon.ico" alt="" loading="lazy" decoding="async">

          <span class="shortcut-label">Kick</span>

        </button>

        <button class="shortcut" data-url="https://www.twitch.tv" type="button">

          <img class="shortcut-icon twitch" src="https://twitch.tv/favicon.ico" alt="" loading="lazy" decoding="async">

          <span class="shortcut-label">Twitch</span>

        </button>

        <button class="shortcut" data-url="https://www.snapchat.com" type="button">

          <img class="shortcut-icon snapchat" src="https://static.snapchat.com/favicon.ico" alt="" loading="lazy" decoding="async">

          <span class="shortcut-label">Snapchat</span>

        </button>

        <button class="shortcut" data-url="https://www.instagram.com" type="button">

          <img class="shortcut-icon instagram" src="https://static.cdninstagram.com/rsrc.php/yr/r/rzWiSjZRxk5.webp" alt="" loading="lazy" decoding="async">

          <span class="shortcut-label">Instagram</span>

        </button>

        <button class="shortcut" data-url="https://discord.com/app" type="button">

          <img class="shortcut-icon discord" src="https://cdn.prod.website-files.com/6257adef93867e50d84d30e2/6266bc493fb42d4e27bb8393_847541504914fd33810e70a0ea73177e.ico" alt="" loading="lazy" decoding="async">

          <span class="shortcut-label">Discord</span>

        </button>

      </div>

    </div>

  </section>

  <section id="workspace" class="workspace">

    <div class="browser-toolbar">

      <button class="toolbar-btn" id="back" type="button" title="Back" aria-label="Back">‹</button>

      <button class="toolbar-btn" id="forward" type="button" title="Forward" aria-label="Forward">›</button>

      <button class="toolbar-btn" id="reload" type="button" title="Reload" aria-label="Reload">↻</button>

      <form id="sj-form" class="address-form" autocomplete="off">

        <input id="sj-search-engine" value="https://www.google.com/search?q=%s" type="hidden">

        <input id="sj-address" type="text"

               placeholder="Search or enter address"

               aria-label="Search or enter address">

      </form>

    </div>

    <div id="frames-container"></div>

    <div class="error-box">

      <p id="sj-error"></p>

      <pre id="sj-error-code"></pre>

    </div>

  </section>

  <aside class="tabs-rail" id="tabs-rail" aria-label="Browser tabs">

    <div id="tab-list" class="tab-list"></div>

    <button id="rail-new-tab" class="rail-add" type="button" title="New tab" aria-label="New tab">

      <span>＋</span>

      <span class="rail-add-label">New tab</span>

    </button>

  </aside>


  <script>
    // Recover shortcut and tab favicons, including images inserted later by index.js.
    (() => {
      const attempted = new WeakSet();
      const fallbackData = (label) => {
        const letter = (label || 'C').trim().charAt(0).toUpperCase() || 'C';
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="#18233b"/><rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)" fill-opacity=".18" stroke="#b9dfff" stroke-opacity=".5"/><text x="32" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#f5f8ff">${letter}</text></svg>`;
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      };
      document.addEventListener('error', (event) => {
        const img = event.target;
        if (!(img instanceof HTMLImageElement) || !img.matches('.shortcut-icon, .tab-favicon, img.favicon')) return;
        if (!attempted.has(img)) {
          attempted.add(img);
          const card = img.closest('.shortcut, .tab-item');
          const label = card?.querySelector('.shortcut-label, .tab-title')?.textContent || img.alt || img.title || 'Cloud';
          let host = '';
          try {
            const source = img.closest('[data-url]')?.getAttribute('data-url') || img.currentSrc || img.src;
            host = new URL(source, location.href).hostname;
          } catch (_) {}
          if (host && !host.endsWith(location.hostname)) {
            img.src = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(host) + '&sz=64';
            img.dataset.cloudFallbackLabel = label;
            return;
          }
        }
        img.onerror = null;
        img.src = fallbackData(img.dataset.cloudFallbackLabel || img.alt || img.title || img.closest('.shortcut, .tab-item')?.querySelector('.shortcut-label, .tab-title')?.textContent || 'Cloud');
      }, true);
    })();
  </script>

</body>
